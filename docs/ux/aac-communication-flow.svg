<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280"><rect width="1100" height="280" fill="#f5f8f5"/><text x="40" y="48" font-family="Arial" font-size="26" font-weight="bold" fill="#19493f">Communication flow · No scrolling to complete a message</text><g font-family="Arial" font-size="21" text-anchor="middle"><rect x="30" y="90" width="215" height="105" rx="17" fill="#e8f1fa" stroke="#89afce"/><text x="137" y="129">1. Select</text><text x="137" y="158" font-weight="bold">pictograms</text><text x="270" y="151" font-size="36">→</text><rect x="304" y="90" width="215" height="105" rx="17" fill="#e4f1e7" stroke="#85b49c"/><text x="411" y="129">2. See suggested</text><text x="411" y="158" font-weight="bold">sentence</text><text x="540" y="151" font-size="36">→</text><rect x="577" y="90" width="215" height="105" rx="17" fill="#e4f1e7" stroke="#85b49c"/><text x="684" y="129">3. Speak or</text><text x="684" y="158" font-weight="bold">use raw symbols</text><text x="812" y="151" font-size="36">→</text><rect x="851" y="90" width="215" height="105" rx="17" fill="#faf0df" stroke="#dab78c"/><text x="958" y="129">4. Confirm</text><text x="958" y="158" font-weight="bold">or edit</text></g><text x="40" y="246" font-family="Arial" font-size="18" fill="#47635a">AI is a suggestion, not a statement of the user's intent. No automatic learning before confirmation.</text></svg>