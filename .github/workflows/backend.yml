name: Backend

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pictoflow_test
          POSTGRES_PASSWORD: pictoflow_test
          POSTGRES_DB: pictoflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pictoflow_test -d pictoflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PICTOFLOW_TEST_DATABASE_URL: postgresql+psycopg://pictoflow_test:pictoflow_test@127.0.0.1:5432/pictoflow_test
      PICTOFLOW_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - run: python -m app.ai.evaluation --output ai-evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation-python-${{ matrix.python-version }}
          path: backend/ai-evaluation.json
