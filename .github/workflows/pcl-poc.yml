name: PCL functional POC
on:
  push:
  pull_request:
jobs:
  compose-and-recall:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pictoflow_test
          POSTGRES_PASSWORD: pictoflow_test
          POSTGRES_DB: pictoflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pictoflow_test -d pictoflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PICTOFLOW_DATABASE_URL: postgresql+psycopg://pictoflow_test:pictoflow_test@127.0.0.1:5432/pictoflow_test
      PICTOFLOW_AUTH_ENABLED: "false"
      PICTOFLOW_AI_PROVIDER: disabled
      PICTOFLOW_API_BASE_URL: http://127.0.0.1:8000/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Prepare isolated API
        working-directory: backend
        run: |
          python -m pip install .
          python -m alembic upgrade head
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > /tmp/pictoflow-poc-api.log 2>&1 &
      - name: Build the communication interface
        working-directory: admin
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run start -- --port 3130 > /tmp/pictoflow-poc-ui.log 2>&1 &
      - name: Compose, correct, replay and recall through the browser
        working-directory: admin
        run: |
          node --input-type=module -e 'const end=Date.now()+30000; for(;;){try{if((await fetch("http://127.0.0.1:3130/api/pictoflow/health")).ok)break;}catch{} if(Date.now()>end)process.exit(1);await new Promise(r=>setTimeout(r,300));}'
          node tests/e2e/pcl-learning.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-pcl-learning
          path: admin/.local/pcl-learning/*.png
