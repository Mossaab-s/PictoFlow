name: PCL functional POC
on:
  push:
  pull_request:
jobs:
  compose-and-recall:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pictoflow_test
          POSTGRES_PASSWORD: pictoflow_test
          POSTGRES_DB: pictoflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pictoflow_test -d pictoflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PICTOFLOW_DATABASE_URL: postgresql+psycopg://pictoflow_test:pictoflow_test@127.0.0.1:5432/pictoflow_test
      PICTOFLOW_AUTH_ENABLED: "false"
      PICTOFLOW_AI_PROVIDER: disabled
      PICTOFLOW_API_BASE_URL: http://127.0.0.1:8000/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Prepare isolated API
        working-directory: backend
        run: |
          python -m pip install .
          python -m alembic upgrade head
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > /tmp/pictoflow-poc-api.log 2>&1 &
      - name: Use the Ubuntu archive for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - name: Build the communication interface
        id: communication-build
        working-directory: admin
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run start -- --port 3130 > /tmp/pictoflow-poc-ui.log 2>&1 &
      - name: Wait for the isolated communication API
        id: communication-ready
        working-directory: admin
        run: |
          node --input-type=module -e 'const end=Date.now()+30000; for(;;){try{if((await fetch("http://127.0.0.1:3130/api/pictoflow/health")).ok)break;}catch{} if(Date.now()>end)process.exit(1);await new Promise(r=>setTimeout(r,300));}'
      - name: Compose, correct, replay and recall
        if: ${{ !cancelled() && steps.communication-ready.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/pcl-learning.mjs
      - name: Choose personal-memory suggestions
        if: ${{ !cancelled() && steps.communication-ready.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/memory-suggestions.mjs
      - name: Prepare a missing word and return
        if: ${{ !cancelled() && steps.communication-ready.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/missing-word.mjs
      - name: Inspect explicit keyboard usage
        if: ${{ !cancelled() && steps.communication-ready.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/keyboard-usage.mjs
      - name: Reopen the protected offline copy
        if: ${{ !cancelled() && steps.communication-ready.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/offline-reopen.mjs
      - name: Observe optional selection rhythm
        if: ${{ !cancelled() && steps.communication-ready.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/selection-rhythm.mjs
      - name: Choose daily pictograms
        if: ${{ !cancelled() && steps.communication-ready.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/daily-pictograms.mjs
      - name: Verify communication UX and recovery
        if: ${{ !cancelled() && steps.communication-ready.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/ux-communication.mjs
      - name: Prepare the isolated fixture-driven FakeProvider API
        if: ${{ !cancelled() && steps.communication-build.outcome == 'success' }}
        id: fake-api
        working-directory: backend
        run: |
          PICTOFLOW_UX_TESTING=1 PICTOFLOW_REDIS_URL=redis://127.0.0.1:6379/0 python -m uvicorn tests.ux_fake_application:app --host 127.0.0.1 --port 8001 --no-access-log > /tmp/pictoflow-ux-fake-api.log 2>&1 &
      - name: Verify optional formulation with the real FakeProvider
        if: ${{ !cancelled() && steps.fake-api.outcome == 'success' }}
        working-directory: admin
        run: |
          PICTOFLOW_API_BASE_URL=http://127.0.0.1:8001/api/v1 npm run start -- --port 3131 > /tmp/pictoflow-ux-fake-ui.log 2>&1 &
          node --input-type=module -e 'const end=Date.now()+30000; for(;;){try{if((await fetch("http://127.0.0.1:3131/api/pictoflow/health")).ok)break;}catch{} if(Date.now()>end)process.exit(1);await new Promise(r=>setTimeout(r,300));}'
          node tests/e2e/ux-fake-formulation.mjs
      - name: Explain literal proposals without retrying the model
        if: ${{ !cancelled() && steps.fake-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/literal-explanations.mjs
      - name: Reuse pending hypotheses before explicitly requesting new ones
        if: ${{ !cancelled() && steps.fake-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/interpretation-reuse.mjs
      - name: Compare alternative meanings before explicit human validation
        if: ${{ !cancelled() && steps.fake-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/phrase-hypotheses.mjs
      - name: Communicate with persistent message and automatic phrase previews
        if: ${{ !cancelled() && steps.fake-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/compact-communication.mjs
      - name: Prepare isolated authenticated capability API
        id: capability-api
        if: ${{ !cancelled() && steps.communication-build.outcome == 'success' }}
        working-directory: backend
        env:
          PICTOFLOW_ENVIRONMENT: test
          PICTOFLOW_AUTH_ENABLED: "true"
          PICTOFLOW_AUTH_ORIGIN: http://127.0.0.1:3132
          PICTOFLOW_CAPABILITY_TESTING: "1"
        run: |
          python -m tests.bootstrap_capability_accounts
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8002 --no-access-log > /tmp/pictoflow-capability-api.log 2>&1 &
      - name: Verify real authenticated profile capabilities
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: |
          PICTOFLOW_API_BASE_URL=http://127.0.0.1:8002/api/v1 npm run start -- --port 3132 > /tmp/pictoflow-capability-ui.log 2>&1 &
          node --input-type=module -e 'const end=Date.now()+30000; for(;;){try{if((await fetch("http://127.0.0.1:3132/api/pictoflow/health")).ok)break;}catch{} if(Date.now()>end)process.exit(1);await new Promise(r=>setTimeout(r,300));}'
          node tests/e2e/profile-capabilities.mjs
      - name: Verify authenticated three-space journeys
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/three-spaces.mjs
      - name: Verify authenticated supporter phrase review
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/support-review.mjs
      - name: Verify protected accompanied handoff
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/accompanied-session.mjs
      - name: Verify readable personal memory evolution
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/memory-evolution.mjs
      - name: Review vocabulary needs with current accepted evidence
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/vocabulary-needs.mjs
      - name: Inspect the read-only administrator console
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/admin-console.mjs
      - name: Verify the complete authenticated POC journey
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/complete-journey.mjs
      - name: Prepare touches through image, word and review
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/keyboard-preparation.mjs
      - name: Prepare an illustrated touch from an accepted vocabulary need
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/need-touch.mjs
      - name: Find and organize existing touches
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/touch-library.mjs
      - name: Choose a free destination visually
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/visual-placement.mjs
      - name: Verify delayed selection focus without an API
        if: ${{ !cancelled() && steps.communication-build.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/selection-focus.mjs
      - name: Find a personal touch while communicating
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/communication-search.mjs
      - name: Reuse accepted phrases directly from compact communication
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/compact-personal-phrases.mjs
      - name: Replace a pictogram directly in compact communication
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/compact-touch-replacement.mjs
      - name: Reorder a pictogram directly in compact communication
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/compact-touch-order.mjs
      - name: Insert a forgotten pictogram directly in compact communication
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/compact-touch-insertion.mjs
      - name: Review and safely save a personal phrase correction
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/compact-phrase-correction.mjs
      - name: Correct one chosen message touch
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/message-correction.mjs
      - name: Move a chosen touch with an explicit order preview
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/message-order.mjs
      - name: Replace a chosen touch after picture and word review
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/message-replacement.mjs
      - name: Insert a personal touch at a reviewed message position
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/message-insertion.mjs
      - name: Prepare an independent editable copy of a finished message
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/message-copy.mjs
      - name: Configure and probe an administrator-selected provider
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/provider-settings.mjs
      - name: Manage scoped practitioner, parent and patient accounts
        if: ${{ !cancelled() && steps.capability-api.outcome == 'success' }}
        working-directory: admin
        run: node tests/e2e/scoped-accounts.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-pcl-learning
          path: |
            admin/.local/pcl-learning/*.png
            admin/.local/interpretation-reuse/*.png
            admin/.local/interpretation-reuse/report.json
            admin/.local/phrase-hypotheses/*.png
            admin/.local/phrase-hypotheses/report.json
            admin/.local/compact-communication/*.png
            admin/.local/compact-communication/report.json
            admin/.local/memory-suggestions/*.png
            admin/.local/keyboard-usage/*.png
            admin/.local/offline-reopen/*.png
            admin/.local/selection-rhythm/*.png
            admin/.local/daily-pictograms/*.png
            admin/.local/ux-communication/*.png
            admin/.local/literal-explanations/*.png
            admin/.local/keyboard-preparation/*.png
            admin/.local/need-touch/*.png
            admin/.local/touch-library/*.png
            admin/.local/visual-placement/*.png
            admin/.local/communication-search/*.png
            admin/.local/selection-focus/report.json
            admin/.local/compact-personal-phrases/*.png
            admin/.local/compact-personal-phrases/report.json
            admin/.local/compact-touch-replacement/*.png
            admin/.local/compact-touch-replacement/report.json
            admin/.local/compact-touch-order/*.png
            admin/.local/compact-touch-order/report.json
            admin/.local/compact-touch-insertion/*.png
            admin/.local/compact-touch-insertion/report.json
            admin/.local/compact-phrase-correction/*.png
            admin/.local/compact-phrase-correction/report.json
            admin/.local/message-correction/*.png
            admin/.local/message-order/*.png
            admin/.local/message-replacement/*.png
            admin/.local/message-insertion/*.png
            admin/.local/message-copy/*.png
            admin/.local/provider-settings/*.png
            admin/.local/provider-settings/report.json
            admin/.local/scoped-accounts/*.png
            admin/.local/scoped-accounts/report.json
            admin/.local/profile-capabilities/*.png
            admin/.local/three-spaces/*.png
            admin/.local/support-review/*.png
            admin/.local/accompanied-session/*.png
            admin/.local/memory-evolution/*.png
            admin/.local/vocabulary-needs/*.png
            admin/.local/admin-console/*.png
            admin/.local/complete-journey/*.png
            admin/.local/complete-journey/report.json
