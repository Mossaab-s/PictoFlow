name: Local Compose stack

on:
  push:
  pull_request:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify public deployment isolation and TLS recovery policy
        run: python deploy/test_vps.py --docker

  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install age encryption tools
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Verify backup systemd units
        run: systemd-analyze verify deploy/systemd/pictoflow-backup.service deploy/systemd/pictoflow-backup.timer
      - name: Verify encrypted backup and isolated server recovery
        run: python deploy/test_server_backup.py

  https:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify local HTTPS, redirects, proxy headers and persistent certificate authority
        run: python deploy/test_local_https.py

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify local stack, migration and both AI modes
        run: python deploy/smoke_test.py
